# KiCad checks for every project under hardware/: ERC, DRC, schematic PDF, BOM,
# board pictures, Gerbers, drill and placement files for the factory.
# Results: the "kicad-out" artifact of each run. A run fails on ERC/DRC errors.
# License: AGPL-3.0-or-later.
name: KiCad checks

on:
  push:
    paths: ['hardware/**', '.github/workflows/kicad.yml']
  pull_request:
    paths: ['hardware/**']
  workflow_dispatch:

jobs:
  kicad:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
    env:
      HOME: /tmp/home
    steps:
      - uses: actions/checkout@v4

      - name: Check and export
        shell: bash
        run: |
          set -u
          mkdir -p "$HOME" out
          kicad-cli version | tee out/kicad-version.txt
          status=0
          # one project = one .kicad_pro; its root sheet and board have the same name
          while IFS= read -r pro; do
            dir=$(dirname "$pro"); name=$(basename "${pro%.kicad_pro}")
            o="out/$name"; mkdir -p "$o/fab"
            if [ -f "$dir/$name.kicad_sch" ]; then
              kicad-cli sch erc --severity-error --exit-code-violations -o "$o/erc.rpt" "$dir/$name.kicad_sch" || { echo "::error::ERC errors in $name"; status=1; }
              kicad-cli sch erc --severity-all -o "$o/erc-all.rpt" "$dir/$name.kicad_sch" >/dev/null 2>&1 || true
              echo "::group::ERC $name (all severities)"
              awk 'NR<=300' "$o/erc-all.rpt" 2>/dev/null || true      # no head: the job shell runs with pipefail
              echo "::endgroup::"
              kicad-cli sch export pdf -o "$o/$name-schematic.pdf" "$dir/$name.kicad_sch" || true
              kicad-cli sch export bom -o "$o/$name-bom.csv" "$dir/$name.kicad_sch" || true
            fi
            if [ -f "$dir/$name.kicad_pcb" ]; then
              # --schematic-parity: the board must match the schematic; an UNROUTED marker file
              # (routing in progress) keeps the report but does not fail the run
              if kicad-cli pcb drc --severity-error --exit-code-violations --schematic-parity --refill-zones \
                   -o "$o/drc.rpt" "$dir/$name.kicad_pcb"; then :
              elif [ -f "$dir/UNROUTED" ]; then echo "::warning::$name is not routed yet, DRC report kept"
              else echo "::error::DRC errors in $name"; status=1; fi
              # full report (warnings too) printed into the log without the unconnected items: readable without the artifact
              kicad-cli pcb drc --severity-all --schematic-parity --refill-zones -o "$o/drc-all.rpt" "$dir/$name.kicad_pcb" >/dev/null 2>&1 || true
              echo "::group::DRC $name (all severities, unconnected items left out)"
              # every violation type with its count and the first 3 examples (a full list does not fit the log of a big board)
              awk '/^\*\* Found [0-9]+ unconnected/{skip=1; next} /^\*\* Found [0-9]+ (DRC|Footprint|errors)/{skip=0; show=0; next}
                   skip{next} /^\[[a-z_]+\]/{t=$1; c[t]++; show=(c[t]<=3)} show{print}
                   END{for (t in c) print "COUNT " t " " c[t]}' "$o/drc-all.rpt" 2>/dev/null || true
              grep -E '^\*\* Found' "$o/drc-all.rpt" 2>/dev/null || true
              echo "::endgroup::"
              kicad-cli pcb export svg --layers "F.Cu,F.Silkscreen,Edge.Cuts" --exclude-drawing-sheet --mode-single -o "$o/$name-top.svg" "$dir/$name.kicad_pcb" || true
              kicad-cli pcb export svg --layers "B.Cu,B.Silkscreen,Edge.Cuts" --exclude-drawing-sheet --mode-single --mirror -o "$o/$name-bottom.svg" "$dir/$name.kicad_pcb" || true
              kicad-cli pcb export gerbers -o "$o/fab/" "$dir/$name.kicad_pcb" || true
              kicad-cli pcb export drill -o "$o/fab/" "$dir/$name.kicad_pcb" || true
              kicad-cli pcb export pos --format csv --units mm -o "$o/fab/$name-positions.csv" "$dir/$name.kicad_pcb" || true
            fi
          # quilter/, quilter_raw/: downloaded routing candidates kept for comparison, not projects under work
          done < <(find hardware -name '*.kicad_pro' -not -path '*/backups/*' -not -path '*/quilter/*' -not -path '*/quilter_raw/*' | sort)
          ls -R out
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kicad-out
          path: out
