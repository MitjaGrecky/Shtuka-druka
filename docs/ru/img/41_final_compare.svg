<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 702" width="870" height="702" font-family="Segoe UI, Arial, sans-serif"><title>Было и стало</title><rect width="100%" height="100%" fill="#fff"/><text x="30" y="26" font-size="16" font-weight="700" fill="#1f2933">Было → стало, один масштаб</text><polygon points="30.0,229.0 30.0,199.3 495.8,199.3 495.8,153.4 499.8,153.4 675.3,52.1 769.8,52.1 769.8,229.0" fill="none" stroke="#8a96a3" stroke-width="2.5" stroke-dasharray="7 4"/><polygon points="30.0,229.0 30.0,203.4 34.0,199.3 455.2,199.3 455.2,192.6 460.7,187.2 665.9,52.1 721.2,52.1 725.2,56.2 725.2,229.0" fill="rgba(232,115,26,0.15)" stroke="#e8731a" stroke-width="2.5"/><text x="30" y="264" font-size="12" fill="#8a96a3">- - было (итоговая модель 16–17.11): 548 × 515, дека 22, стенка 34 мм, зад 131</text><text x="30" y="280" font-size="12" fill="#e8731a">— стало: 515 × 515, дека 22, ступенька 9 мм, скат 33°, зад 131</text><text x="30" y="304" font-size="13" font-weight="700" fill="#1f2933">Сверху</text><rect x="30" y="312.5" width="283" height="301" rx="0" fill="none" stroke="#8a96a3" stroke-width="2.5" stroke-dasharray="7 4"/><text x="172" y="463" font-size="13" fill="#8a96a3" text-anchor="middle">515 × 548</text><text x="172" y="630" font-size="11" fill="#52606d" text-anchor="middle">площадь 282 тыс. мм²</text><rect x="373.25" y="312.5" width="283" height="283" rx="10" fill="none" stroke="#e8731a" stroke-width="2.5"/><text x="515" y="454" font-size="13" fill="#e8731a" text-anchor="middle">515 × 515</text><text x="515" y="612" font-size="11" fill="#52606d" text-anchor="middle">площадь 265 тыс. мм²</text></svg>