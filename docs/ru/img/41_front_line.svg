<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 580" width="1010" height="580" font-family="Segoe UI, Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="24" y="30" font-size="18" font-weight="700" fill="#1f2933">Передняя линия входа воздуха (R195): вид музыканта и разрез (концепт дизайнера, 20.11.2026)</text><text x="24" y="52" font-size="12" fill="#52606d">Сверху: передний торец, вид спереди (со стороны музыканта), x от левого края, z от низа корпуса, мм, без зеркала. Высота торца 30 (дека), ножки 3.</text><text x="24" y="70" font-size="12" fill="#52606d">Серая пунктирная — линия в g3 сейчас (x 110–505); чёрная — предложение (x 110–490, отступы 24,5 = 24,5). Геометрия model3d/v8 g3.</text><rect x="30.0" y="121.1" width="952.8" height="55.5" rx="3" fill="#2a2e33" stroke="#111"/><rect x="76.2" y="176.6" width="37.0" height="5.5" fill="#111"/><rect x="899.5" y="176.6" width="37.0" height="5.5" fill="#111"/><line x1="11.5" y1="182.2" x2="1001.2" y2="182.2" stroke="#9aa5b1" stroke-dasharray="2 3"/><text x="999" y="195" font-size="10" fill="#9aa5b1" text-anchor="end">стол</text><circle cx="89.2" cy="155.6" r="10.2" fill="#0b0c0d" stroke="#8a949c" stroke-width="1.2"/><circle cx="178.0" cy="155.6" r="10.2" fill="#0b0c0d" stroke="#8a949c" stroke-width="1.2"/><rect x="233.5" y="160.3" width="730.8" height="3.7" fill="none" stroke="#9aa5b1" stroke-dasharray="4 3"/><rect x="233.5" y="167.3" width="703.0" height="3.7" rx="1.9" fill="#000"/><text x="89.2" y="135.9" font-size="8" fill="#c9d1d6" text-anchor="middle">PHONES 1</text><text x="178.0" y="135.9" font-size="8" fill="#c9d1d6" text-anchor="middle">PHONES 2</text><line x1="188.2" y1="198.8" x2="233.5" y2="198.8" stroke="#d64545"/><text x="210.8" y="211.8" font-size="10.5" fill="#d64545" text-anchor="middle">24,5</text><line x1="233.5" y1="198.8" x2="936.5" y2="198.8" stroke="#d64545"/><text x="585.0" y="211.8" font-size="10.5" fill="#d64545" text-anchor="middle">380 (2 мм; 7,6 см²)</text><line x1="936.5" y1="198.8" x2="982.8" y2="198.8" stroke="#d64545"/><text x="959.6" y="211.8" font-size="10.5" fill="#d64545" text-anchor="middle">25</text><text x="872" y="167" font-size="10.5" fill="#c9d1d6">z 3–5</text><text x="89" y="110" font-size="10" fill="#52606d" text-anchor="middle">x 32</text><text x="178" y="110" font-size="10" fill="#52606d" text-anchor="middle">x 80</text><text x="24" y="270" font-size="14" font-weight="700" fill="#1f2933">Разрез по x 300, вид слева (перед корпуса слева), масштаб ≈ 9:1</text><polygon points="70.0,508.0 226.0,508.0 226.0,469.0 109.0,469.0 109.0,469.0 70.0,469.0" fill="#2a2e33" stroke="#111"/><polygon points="70.0,443.0 70.0,300.0 109.0,300.0 109.0,443.0" fill="#2a2e33" stroke="#111"/><polygon points="70.0,443.0 70.0,432.6 80.4,443.0" fill="#fff" stroke="#111"/><rect x="114.2" y="443.0" width="2.6" height="26.0" fill="#55606a"/><rect x="124.6" y="417.0" width="10.4" height="52.0" fill="#2a2e33" stroke="#111"/><rect x="148.0" y="326.0" width="78.0" height="140.4" fill="#e9eef2" stroke="#9aa5b1" stroke-dasharray="4 3"/><text x="187" y="391" font-size="11" fill="#52606d" text-anchor="middle">аккумулятор</text><text x="187" y="405" font-size="11" fill="#52606d" text-anchor="middle">(с y 6)</text><polyline points="31,456 121,456 121,398 145,398" fill="none" stroke="#2f80ed" stroke-width="2"/><text x="31" y="448" font-size="11" fill="#2f80ed">воздух</text><line x1="18" y1="547" x2="252" y2="547" stroke="#9aa5b1" stroke-dasharray="2 3"/><text x="239" y="561" font-size="10" fill="#9aa5b1">стол (ножки 3)</text><text x="318.0" y="310" font-size="11.5" fill="#1f2933">① капельник: фаска 0,8 на верхней наружной кромке — капля со ската деки по торцу срывается, а не затекает</text><text x="318.0" y="330" font-size="11.5" fill="#1f2933">② сетка от пыли тёмная, утоплена на 3–3,5 мм: линия читается как тень, а не как дырка с потрохами</text><text x="318.0" y="350" font-size="11.5" fill="#1f2933">③ порожек 4 мм (z 3–7) в зазоре y 3–6 перед аккумуляторами: лужа на столе до 4 мм не проходит</text><text x="318.0" y="370" font-size="11.5" fill="#1f2933">Проверить (инженер): место под порожек при аккумуляторах с y 6; прочность нижней губы 3 мм под линией;</text><text x="318.0" y="390" font-size="11.5" fill="#1f2933">оснастка/печать прорези 2 × 380 в стенке 3 мм. Статус: предложение.</text><text x="88" y="412" font-size="12" fill="#b42318" text-anchor="middle">①</text><text x="116" y="533" font-size="12" fill="#b42318" text-anchor="middle">②</text><text x="148" y="430" font-size="12" fill="#b42318" text-anchor="middle">③</text></svg>