<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 982 1289" width="982" height="1289" font-family="Segoe UI, Arial, sans-serif"><title>Три силуэта корпуса: сбоку</title><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d64545"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><line x1="-22.5" y1="317.2" x2="902.6" y2="317.2" stroke="#1f2933" stroke-width="3"/><text x="50.0" y="56.2" font-size="14" fill="#1f2933" text-anchor="start" font-weight="700">A. «Скос»: то же тело, ступенька → скос 60°, скругления, тонкая кромка</text><text x="50.0" y="78.0" font-size="11" fill="#52606d" text-anchor="start">минимум: платы, модель, R152–R173 не трогаем</text><path d="M50.0,317.2 Q50.0,317.2 50.0,317.2 L50.0,285.3 Q50.0,285.3 50.0,285.3 L550.2,285.3 Q550.2,285.3 550.2,285.3 L550.2,236.0 Q550.2,236.0 550.2,236.0 L554.6,236.0 Q554.6,236.0 554.6,236.0 L743.1,127.3 Q743.1,127.3 743.1,127.3 L844.6,127.3 Q844.6,127.3 844.6,127.3 L844.6,317.2 Q844.6,317.2 844.6,317.2 Z" fill="none" fill-opacity="1" stroke="#aab4bf" stroke-width="1" stroke-dasharray="4 3" stroke-linejoin="round"/><path d="M58.7,317.2 Q50.0,317.2 50.0,308.6 L50.0,295.5 Q50.0,285.3 60.1,285.3 L493.7,285.3 Q525.6,285.3 540.1,260.7 L540.1,260.7 Q554.6,236.0 604.8,207.1 L692.9,156.3 Q743.1,127.3 793.9,127.3 L824.3,127.3 Q844.6,127.3 844.6,147.6 L844.6,311.4 Q844.6,317.2 838.8,317.2 Z" fill="#3b4652" fill-opacity="0.92" stroke="#1f2933" stroke-width="2.2" stroke-linejoin="round"/><text x="412.5" y="227.3" font-size="11" fill="#d64545" text-anchor="end">скос ≈ 60° вместо стенки</text><line x1="412.5" y1="233.2" x2="537.2" y2="262.1" stroke="#d64545" stroke-width="1" marker-end="url(#ah)"/><line x1="-22.5" y1="614.5" x2="902.6" y2="614.5" stroke="#1f2933" stroke-width="3"/><text x="50.0" y="353.5" font-size="14" fill="#1f2933" text-anchor="start" font-weight="700">B. «Мягкий клин»: дека наклонена 5,6°, ступеньки нет, гладкий переход в ска