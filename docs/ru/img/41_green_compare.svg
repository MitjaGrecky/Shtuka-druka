<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 362" width="870" height="362" font-family="Segoe UI, Arial, sans-serif"><title>Было, оранжевая, зелёная</title><rect width="100%" height="100%" fill="#fff"/><text x="30" y="26" font-size="16" font-weight="700" fill="#1f2933">Было → «оранжевая» → «зелёная», один масштаб (вид сбоку)</text><polyline points="30.0,229.0 30.0,199.3 495.8,199.3 495.8,153.4 499.8,153.4 675.3,52.1 769.8,52.1 769.8,229.0" fill="none" stroke="#8a96a3" stroke-width="2.5" stroke-dasharray="7 4"/><text x="30" y="266" font-size="12" fill="#8a96a3">— было: 548 × 515, губа + дека 22, стенка 34, зад 131</text><polyline points="30.0,229.0 30.0,199.3 455.2,199.3 455.2,192.6 460.7,187.2 665.9,52.1 725.2,52.1 725.2,229.0" fill="none" stroke="#e8731a" stroke-width="2.5"/><text x="30" y="282" font-size="12" fill="#e8731a">— «оранжевая»: 515, дека 22, ступенька 9, скат 33°, зад 131</text><polyline points="30.0,229.0 30.0,188.5 435.0,188.5 645.0,52.1 705.0,52.1 705.0,229.0" fill="none" stroke="#2f9e5b" stroke-width="2.5"/><text x="30" y="298" font-size="12" fill="#2f9e5b">— «зелёная»: 500, дека 30, без ступеньки, скат 33°, зад 131</text><rect x="416" y="177" width="51" height="11" fill="#6b46c1" fill-opacity="0.5"/><text x="442" y="159" font-size="11" fill="#6b46c1" text-anchor="middle">колесо</text></svg>