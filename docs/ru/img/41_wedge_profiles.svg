<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="Segoe UI, Arial, sans-serif"><title>Профили сбоку</title><rect width="100%" height="100%" fill="#fff"/><text x="30" y="22" font-size="14" font-weight="700" fill="#1f2933">Профили сбоку: сейчас и по вашим линиям (из прогона модели)</text><line x1="16" y1="236" x2="828" y2="236" stroke="#1f2933" stroke-width="2"/><polyline points="30.0,236.0 30.0,205.2 513.0,205.2 513.0,157.6 517.2,157.6 699.2,52.6 797.2,52.6 797.2,236.0" fill="none" stroke="#8a96a3" stroke-width="2.5" stroke-dasharray="6 4"/><text x="30" y="256" font-size="12" fill="#8a96a3">— сейчас: 22 / стенка 34 / 131, глубина 548</text><polyline points="30.0,236.0 30.0,205.2 510.2,205.2 510.2,192.6 728.6,52.6 790.2,52.6 790.2,236.0" fill="none" stroke="#e8731a" stroke-width="2.5"/><text x="30" y="272" font-size="12" fill="#e8731a">— «оранжевая»: 22 / ступенька 9 / 131, глубина 543</text><polyline points="30.0,236.0 30.0,191.2 489.2,191.2 707.6,52.6 769.2,52.6 769.2,236.0" fill="none" stroke="#d64545" stroke-width="2.5"/><text x="30" y="289" font-size="12" fill="#d64545">— «красная»: 32 без ступеньки / 131, глубина 528</text><rect x="430" y="193" width="53" height="12" fill="#6b46c1" fill-opacity="0.6"/><text x="457" y="169" font-size="11" fill="#6b46c1" text-anchor="middle">колесо (на деке 22)</text></svg>