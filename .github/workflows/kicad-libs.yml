# Packs the official KiCad libraries from the same Docker image the checks use,
# so schematic and board scripts can use exactly the same symbols and footprints.
# Run by hand (Actions -> KiCad libraries -> Run workflow). License: AGPL-3.0-or-later.
name: KiCad libraries

on:
  workflow_dispatch:

jobs:
  libs:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
    steps:
      - name: Pack symbols and footprints
        shell: bash
        run: |
          set -e
          share=$(dirname "$(find / -name 'Device.kicad_sym' -path '*symbols*' 2>/dev/null | head -1)")/..
          ls "$share"
          kicad-cli version > kicad-version.txt
          tar -czf kicad-symbols.tar.gz -C "$share" symbols
          tar -czf kicad-footprints.tar.gz -C "$share" footprints
          ls -la *.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: kicad-libs
          path: |
            kicad-symbols.tar.gz
            kicad-footprints.tar.gz
            kicad-version.txt
          compression-level: 0
